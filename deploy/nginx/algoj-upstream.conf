# Bootstrap seed only — REWRITTEN by deploy/deploy-api.sh on every deploy to
# point at the active blue/green port (8081 or 8082).
# Install once at /etc/nginx/conf.d/algoj-upstream.conf (files in conf.d are
# auto-included in the http{} block), then let the script own it — do not
# hand-edit. The public TLS site block and the internal :8080 server
# (algoj-internal.conf) both proxy_pass to this upstream.
upstream algoj_api {
    server 127.0.0.1:8081;
}
