# 공개 사이트(HTTP) — algoj.duckdns.org
#
# 예전에는 박스에서 손으로 만들고 certbot이 고쳐 쓰는 파일이라 저장소에 없었다. 그 박스가
# 사라지면서 설정도 같이 사라졌으므로, 새 박스에서 바로 쓸 수 있게 여기에 둔다.
#
# 설치 (박스에서 1회):
#   sudo cp /opt/algoj/repo/deploy/nginx/algoj-site.conf /etc/nginx/sites-available/algoj
#   sudo ln -sf /etc/nginx/sites-available/algoj /etc/nginx/sites-enabled/algoj
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS는 certbot이 붙인다 — 도메인이 이 박스를 가리키게 한 뒤
#   sudo certbot --nginx -d algoj.duckdns.org
# 를 돌리면 이 파일에 443 server 블록과 80→443 리다이렉트가 추가된다. 그 뒤로 이 파일은
# certbot이 함께 관리하므로, 갱신할 일이 생기면 저장소 쪽도 같이 맞춘다.

server {
    listen 80;
    listen [::]:80;
    server_name algoj.duckdns.org;

    # 업로드 본문 상한은 올리지 않는다 — 큰 테스트케이스는 생성기 양식으로 처리한다
    # (.claude/rules/conventions.md). nginx 기본값과 같은 값을 명시만 해 둔다.
    client_max_body_size 1m;

    # 활성 API 포트는 algoj-upstream.conf가 쥐고 있고, 배포 스크립트가 blue-green으로
    # 갈아끼울 때마다 그 파일을 다시 쓴다. 여기서 포트를 직접 가리키면 안 된다.
    location / {
        proxy_pass http://algoj_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
